services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
        image: 'sail-8.3/app'
        ports:
            - '${APP_PORT:-80}:80'
        depends_on:
            - mysql
            - redis
            - meilisearch
    mysql:
        image: 'mysql/mysql-server:8.0'
    redis:
        image: 'redis:alpine'
    meilisearch:
        image: 'getmeili/meilisearch:v1.12.8'
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://localhost:7700/health']
            retries: 3
            timeout: 5s
